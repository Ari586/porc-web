name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML
        run: |
          echo "=== Validating site structure ==="
          test -f index.html && echo "✓ index.html exists" || (echo "✗ index.html missing" && exit 1)
          test -f styles.css && echo "✓ styles.css exists" || (echo "✗ styles.css missing" && exit 1)
          test -f app.js && echo "✓ app.js exists" || (echo "✗ app.js missing" && exit 1)
          test -f manifest.json && echo "✓ manifest.json exists" || (echo "✗ manifest.json missing" && exit 1)
          test -f favicon.png && echo "✓ favicon.png exists" || (echo "✗ favicon.png missing" && exit 1)
          test -d icons && echo "✓ icons/ directory exists" || (echo "✗ icons/ missing" && exit 1)
          echo "=== All validations passed ==="

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
